name: Release

# Publishes prebuilt binaries so users without a Go toolchain can try mcp-guard
# immediately. Trigger by pushing a semver tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write # required to create the release

jobs:
  release:
    name: Build & publish binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests before releasing
        run: go test ./...

      - name: Resolve version
        id: v
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.v.outputs.tag }}
        run: |
          mkdir -p dist
          targets="darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64"
          for t in $targets; do
            goos="${t%/*}"; goarch="${t#*/}"
            out="mcp-guard"
            [ "$goos" = "windows" ] && out="mcp-guard.exe"
            echo "building $goos/$goarch"
            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath -ldflags "-s -w" \
              -o "dist/$out" ./cmd/mcp-guard
            # No version in the filename, so the stable
            # /releases/latest/download/<name> URL in the README always resolves.
            archive="mcp-guard_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              (cd dist && zip -q "${archive}.zip" "$out" && rm "$out")
            else
              (cd dist && tar -czf "${archive}.tar.gz" "$out" && rm "$out")
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -lh dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$VERSION" dist/* \
            --title "mcp-guard $VERSION" \
            --generate-notes \
            --verify-tag || \
          gh release upload "$VERSION" dist/* --clobber
